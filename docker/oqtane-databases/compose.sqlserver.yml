name: oqtane-sqlserver

services:
  windows:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oqtane-sqlserver-windows
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${OQTANE_DB_PASSWORD:?Set OQTANE_DB_PASSWORD before running Docker Compose}
    ports:
      - "127.0.0.1:14331:1433"
    volumes:
      - sqlserver-windows:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ubuntu:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oqtane-sqlserver-ubuntu
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${OQTANE_DB_PASSWORD:?Set OQTANE_DB_PASSWORD before running Docker Compose}
    ports:
      - "0.0.0.0:14332:1433"
    volumes:
      - sqlserver-ubuntu:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-windows:
  sqlserver-ubuntu:
